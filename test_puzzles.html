<!doctype html>
<html>
<head>
  <title>Puzzle Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #444; padding: 8px 12px; text-align: left; font-size: 13px; }
    th { background: #16213e; }
    .ok { color: #4ade80; font-weight: bold; }
    .fail { color: #f87171; font-weight: bold; }
    .warn { color: #fbbf24; font-weight: bold; }
    h2 { color: #818cf8; }
  </style>
</head>
<body>
<h2>Chess Puzzle Validator — chess.js v0.10.3</h2>
<table id="out">
  <tr>
    <th>#</th><th>ID</th><th>load()</th><th>game_over after load?</th><th>in_checkmate after load?</th><th>move()</th><th>game_over after move?</th><th>in_checkmate after move?</th><th>VERDICT</th>
  </tr>
</table>
<script>
const PUZZLES = [
  { id:"puzzle_1", fen:"6k1/5ppp/8/8/8/8/5PPP/1R4K1 w - - 0 1",         sol:"b1b8" },
  { id:"puzzle_2", fen:"r1bqkb1r/pppp1ppp/2n5/4p3/2B1P3/5Q2/PPPP1PPP/RNB1K1NR w KQkq - 0 1", sol:"f3f7" },
  { id:"puzzle_3", fen:"6nk/6pp/8/8/5N2/8/5PPP/6K1 w - - 0 1",           sol:"f4g6" },
  { id:"puzzle_4", fen:"r3k2r/ppp2ppp/8/3q4/4N3/8/PPPP1PPP/R3K2R w KQkq - 0 1", sol:"e4f6" },
  { id:"puzzle_5", fen:"3r2k1/1p3ppp/8/8/8/8/1Q3PPP/3R2K1 w - - 0 1",   sol:"d1d8" },
  { id:"puzzle_6", fen:"r1b1k2r/pppp1ppp/8/4n3/4Pq2/2P5/PPP2PPP/R1BQK2R w KQkq - 0 1", sol:"c1f4" },
  { id:"puzzle_7", fen:"2r3k1/5ppp/8/8/8/8/5PPP/2R3K1 w - - 0 1",        sol:"c1c8" },
  { id:"puzzle_8", fen:"7k/5Rpp/8/8/8/8/6PP/6K1 w - - 0 1",              sol:"f7f8" },
];

const tbody = document.getElementById("out");
PUZZLES.forEach((p, i) => {
  const c = new Chess();
  const loaded = c.load(p.fen);
  const goAfterLoad = c.game_over();
  const mateAfterLoad = c.in_checkmate();

  let moveResult = null, goAfterMove = "-", mateAfterMove = "-";
  if (loaded) {
    moveResult = c.move({ from: p.sol.slice(0,2), to: p.sol.slice(2,4), promotion: "q" });
    if (moveResult) {
      goAfterMove = c.game_over();
      mateAfterMove = c.in_checkmate();
    }
  }

  const ok = loaded && !goAfterLoad && !mateAfterLoad && moveResult !== null;
  const verdict = ok ? '<span class="ok">PASS</span>' : '<span class="fail">FAIL</span>';

  const loadTd  = loaded ? '<span class="ok">true</span>'  : '<span class="fail">false</span>';
  const goLoad  = goAfterLoad   ? '<span class="fail">true</span>'  : '<span class="ok">false</span>';
  const matLoad = mateAfterLoad ? '<span class="fail">true</span>'  : '<span class="ok">false</span>';
  const moveTd  = moveResult ? '<span class="ok">' + moveResult.san + '</span>' : '<span class="fail">null (illegal)</span>';
  const goMove  = goAfterMove === "-" ? "-" : (goAfterMove ? '<span class="ok">true</span>' : '<span class="warn">false</span>');
  const matMove = mateAfterMove === "-" ? "-" : (mateAfterMove ? '<span class="ok">true</span>' : '<span class="warn">false</span>');

  tbody.innerHTML += '<tr><td>' + (i+1) + '</td><td>' + p.id + '</td><td>' + loadTd + '</td><td>' + goLoad + '</td><td>' + matLoad + '</td><td>' + moveTd + '</td><td>' + goMove + '</td><td>' + matMove + '</td><td>' + verdict + '</td></tr>';
});
</script>
</body>
</html>
